<text x="890" y="471" class="small">GND</text>
<text x="60" y="510" class="small">V(GPIO34) = V(S) / 2, at most 1.65 V with a 3.3 V module supply.</text>
<text x="60" y="540" class="small">The divider loads the module. Calibrate dark/bright with this complete circuit attached.</text>
